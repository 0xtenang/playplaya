<title>Trayfarers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Jersey+15&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a game dock pinned to the bottom of the window, with a ledger desk above it. One deliberate dark look. */
:root {
  color-scheme: dark;
  --ink: #161220; --plum: #211a2d; --plum2: #2b2339; --plum3: #372d48; --line: #443857;
  --text: #efe7d8; --dim: #ada1b8; --lamp: #f4b942; --good: #86c46b; --bad: #e8674f;
  --pixel: 'Jersey 15', ui-monospace, Menlo, monospace;
  --body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); font: 15px/1.45 var(--body); overflow: hidden; }
#app { height: 100%; display: flex; flex-direction: column; min-height: 0; }
h2, h3, h4 { font-family: var(--pixel); font-weight: 400; margin: 0; text-wrap: balance; }
h2 { font-size: 32px; line-height: 1; letter-spacing: .5px; }
h3 { font-size: 23px; line-height: 1.1; color: var(--lamp); margin-block: 18px 8px; }
h4 { font-size: 19px; line-height: 1.1; margin-bottom: 4px; }
p { margin: 0; }
.px { image-rendering: pixelated; width: 30px; height: 30px; flex: none; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 500; }
.sub { color: var(--dim); font-size: 13.5px; }
.dim { color: var(--dim); }
button, input, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

#top { display: flex; align-items: center; gap: 16px; padding-block: 8px; padding-left: var(--gut-l); padding-right: var(--gut-r); background: var(--plum); border-bottom: 2px solid var(--line); }
.brand { font: 400 30px/1 var(--pixel); color: var(--lamp); letter-spacing: 1px; }
.wallet { margin-left: auto; display: flex; gap: 8px; }
.purse { display: flex; align-items: baseline; gap: 6px; padding: 3px 10px; background: var(--ink); border: 1px solid var(--line); border-radius: 2px; }
.purse b { font: 700 15px var(--mono); }
.purse small { color: var(--dim); font-size: 12px; }
.purse.marks b { color: var(--lamp); }
#tabs { display: flex; gap: 2px; overflow-x: auto; padding-left: var(--gut-l); padding-right: var(--gut-r); background: var(--plum); scrollbar-width: none; flex: none; }
#tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 6px 12px; font: 400 21px/1.15 var(--pixel); color: var(--dim); cursor: pointer; white-space: nowrap; }
#tabs button:hover { color: var(--text); }
#tabs button[aria-selected="true"] { color: var(--lamp); border-bottom-color: var(--lamp); }
#hint { padding-block: 6px; padding-left: var(--gut-l); padding-right: var(--gut-r); background: #3a2d18; color: #f7dfa6; font-size: 13.5px; border-bottom: 1px solid #5c4720; flex: none; }
#panel { flex: 1; overflow-y: auto; min-height: 0; }
.inner { padding-block: 14px 24px; padding-left: var(--gut-l); padding-right: var(--gut-r); max-width: 1180px; margin-inline: auto; }
.headrow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 10px; }
.headrow .sub { flex: 1 1 280px; min-width: 0; }

.btn { background: var(--plum3); border: 1px solid var(--line); border-radius: 2px; padding: 6px 12px; cursor: pointer; box-shadow: 0 2px 0 #0d0a13; font-size: 14px; }
.btn:hover:not(:disabled) { background: #43374f; }
.btn:active:not(:disabled) { transform: translateY(1px); box-shadow: 0 1px 0 #0d0a13; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary, .btn.lamp { background: var(--lamp); color: #231807; border-color: #b98419; font-weight: 700; }
.btn.primary:hover:not(:disabled), .btn.lamp:hover:not(:disabled) { background: #ffcb60; }
.btn.danger { background: #5a2823; border-color: #8a3f35; color: #ffd9d2; }
.btn.danger:hover:not(:disabled) { background: #713029; }
.btn.tiny { padding: 3px 8px; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 7px; align-items: center; }
.chips.bulk { gap: 8px; }
.chip { background: var(--plum2); border: 1px solid var(--line); border-radius: 2px; padding: 3px 8px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.chip:hover { background: var(--plum3); }
.chip[aria-pressed="true"] { background: var(--text); color: var(--ink); border-color: var(--text); }
.chip[aria-pressed="true"] .dim { color: #574c63; }
.gemdot { display: inline-block; width: 9px; height: 9px; flex: none; margin-right: 1px; box-shadow: inset -1px -1px 0 rgba(0,0,0,.3); }
.row { display: flex; gap: 8px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
input, select { background: var(--ink); border: 1px solid var(--line); border-radius: 2px; padding: 5px 8px; min-width: 0; }
input[type=number] { width: 96px; font-family: var(--mono); }
.empty { color: var(--dim); padding: 12px 0; }

/* Crew */
.herogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 10px; }
.hero { background: var(--plum); border: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.hero.on { border-color: var(--lamp); }
.hero header { display: flex; gap: 10px; align-items: center; }
.hero header > div { flex: 1; min-width: 0; }
.portrait { width: 60px; height: 54px; background: var(--ink); }
.hero h3 { margin: 0; color: var(--text); }
.hero header p { font-size: 13px; color: var(--dim); }
.xp { height: 5px; background: var(--ink); margin-top: 4px; }
.xp span { display: block; height: 100%; background: var(--good); }
.xp.big { height: 9px; margin-block: 8px 4px; }
.stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; margin: 0; font-size: 12px; }
.stats dt { color: var(--dim); }
.stats dd { margin: 0; font: 500 13px var(--mono); }
.stats.col { display: flex; flex-direction: column; gap: 3px; font-size: 13.5px; }
.stats.col > div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dotted var(--line); padding-bottom: 2px; }
.stats.col dd { text-align: right; }
.stats .hl dt, .stats .hl dd { color: var(--lamp); }
.gearrow { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.gslot { aspect-ratio: 1; background: var(--ink); border: 2px solid var(--g, var(--line)); padding: 2px; cursor: pointer; display: grid; place-items: center; border-radius: 2px; min-width: 0; }
.gslot .px { width: 100%; height: auto; max-width: 30px; }
.gslot.empty { padding: 2px; opacity: .55; border-style: dashed; }
.gslot:hover { background: var(--plum3); }
.hero footer { display: flex; gap: 6px; margin-top: auto; }

/* Pack */
.mats { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.mat { display: flex; align-items: center; gap: 6px; background: var(--plum); border: 1px solid var(--line); padding: 3px 9px 3px 4px; font-size: 13px; }
.mat .px { width: 20px; height: 20px; }
.mat b { font: 700 13px var(--mono); margin-left: 2px; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; align-items: start; }
.split.even { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; margin-bottom: 4px; }
.col-side { position: sticky; top: 0; min-width: 0; }
.col-main { min-width: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, 50px); gap: 5px; }
.tile { position: relative; width: 50px; height: 50px; background: var(--plum); border: 2px solid var(--g); display: grid; place-items: center; cursor: pointer; padding: 0; border-radius: 2px; }
.tile:hover { background: var(--plum3); }
.tile.sel { background: var(--plum3); outline: 2px solid var(--text); outline-offset: 1px; }
.lv { position: absolute; right: 1px; bottom: 0; font: 500 10.5px var(--mono); color: var(--text); text-shadow: 0 1px 0 #000; }
.tag { position: absolute; left: 1px; top: 0; font: 700 10.5px var(--mono); padding: 0 2px; background: var(--ink); }
.tag.eq { color: var(--good); } .tag.lock { color: var(--lamp); } .tag.hold { color: #8fb6d9; }
.detail { background: var(--plum); border: 1px solid var(--line); border-top: 3px solid var(--g, var(--line)); padding: 12px; display: flex; flex-direction: column; gap: 9px; }
.detail.empty { padding: 14px; }
.detail h3 { margin: 0; }
.dhead { display: flex; gap: 10px; align-items: center; }
.dhead .px { width: 40px; height: 40px; }
.dhead h3 { color: var(--text); }
.dhead p { font-size: 13px; color: var(--dim); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.block { border-top: 1px solid var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.block:empty { display: none; }
.etchrow { display: flex; flex-wrap: wrap; gap: 4px; }
.listform label { font-size: 13.5px; }
.quote { font-size: 13px; color: #f7dfa6; }
.why { color: #f3c3ae; }

/* Forge */
.card { background: var(--plum); border: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.odds { display: flex; flex-direction: column; gap: 6px; }
.odd { display: grid; grid-template-columns: minmax(120px, 190px) minmax(40px, 1fr) 56px; gap: 8px; align-items: center; font-size: 13.5px; }
.oname { display: flex; align-items: center; gap: 4px; min-width: 0; }
.otrack { height: 8px; background: var(--ink); display: block; }
.otrack span { display: block; height: 100%; border-radius: 0 2px 2px 0; }
.odd b { text-align: right; }
.inline { font-size: 13.5px; color: var(--dim); }
.result { border-left: 3px solid var(--g); padding-left: 8px; font-weight: 700; }
.unlocks { list-style: none; padding: 0; margin: 4px 0 0; display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; color: var(--dim); }
.unlocks li { display: flex; gap: 8px; }
.unlocks b { width: 20px; text-align: right; flex: none; }
.unlocks .got { color: var(--text); }
.unlocks .got b { color: var(--good); }

/* Exchange */
.pill { display: inline-block; padding: 0 7px; border: 1px solid; font: 700 12px var(--mono); margin-right: 2px; border-radius: 2px; }
.pill.shared { color: var(--good); } .pill.readonly { color: #8fb6d9; } .pill.solo { color: var(--lamp); }
.bulletin { background: var(--plum); border: 1px solid var(--line); border-left: 4px solid var(--lamp); padding: 7px 10px; font-size: 13.5px; }
.bulletin b { font: 400 18px/1 var(--pixel); margin-right: 4px; }
.bulletin.glut { border-left-color: var(--bad); }
.bulletin.shortage { border-left-color: var(--good); }
.lslots { display: grid; grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 8px; margin-bottom: 8px; }
.lslot { background: var(--plum); border: 1px dashed var(--line); padding: 9px; min-height: 66px; display: flex; flex-direction: column; justify-content: center; gap: 6px; min-width: 0; }
.lslot.busy { border: 1px solid var(--lamp); align-items: flex-start; }
.lslot.busy .px { width: 30px; height: 30px; }
.lslot.cool { background: var(--ink); }
.matform { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-top: 10px; font-size: 13.5px; }
.filters { margin-bottom: 8px; }
.filters .sub { flex: 1 1 200px; min-width: 0; }
.filters input[type=search] { width: 190px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); }
table.mk { width: 100%; border-collapse: collapse; font-size: 14px; }
table.mk th { text-align: left; font: 500 12px var(--mono); color: var(--dim); padding: 6px 8px; background: var(--plum); position: sticky; top: 0; }
table.mk td { padding: 5px 8px; border-top: 1px solid #30273f; vertical-align: middle; }
table.mk tr:hover td { background: #261f33; }
table.mk .num { text-align: right; white-space: nowrap; }
table.mk td:last-child { text-align: right; }
.nm { display: flex; align-items: center; gap: 8px; min-width: 150px; }
.nm .px { width: 26px; height: 26px; }
.nm span { display: flex; flex-direction: column; min-width: 0; }
.nm small { color: var(--dim); font-size: 12px; }
.nm2 { white-space: nowrap; }
.floor { display: block; font: 500 10.5px var(--mono); color: #f3c3ae; }
.spark { display: block; }
#tip { position: fixed; z-index: 30; background: var(--text); color: var(--ink); padding: 2px 7px; font: 500 12px var(--mono); pointer-events: none; border-radius: 2px; }

/* Almanac and Ledger */
.talents { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
.talent { background: var(--plum); border: 1px solid var(--line); padding: 10px; display: flex; gap: 10px; justify-content: space-between; align-items: center; min-width: 0; }
.talent > div { min-width: 0; }
.talent .btn { flex: none; white-space: nowrap; }
.pips { display: flex; gap: 3px; margin-top: 5px; flex-wrap: wrap; }
.pips i { width: 9px; height: 9px; background: var(--ink); border: 1px solid var(--line); }
.pips i.on { background: var(--lamp); border-color: var(--lamp); }
.maxed { font: 700 13px var(--mono); color: var(--good); flex: none; }
.flow { display: grid; grid-template-columns: 120px minmax(40px, 1fr) 70px; gap: 8px; align-items: center; font-size: 13.5px; margin-bottom: 4px; }
.flow b { text-align: right; }
.ftrack { display: block; height: 8px; background: var(--ink); min-width: 40px; }
.ftrack span { display: block; height: 100%; background: var(--lamp); border-radius: 0 2px 2px 0; }
.floorcell { display: grid; grid-template-columns: minmax(50px, 1fr) 44px; gap: 8px; align-items: center; min-width: 110px; }
.floorcell .ftrack span { background: #d28a6c; }
.floorcell b { text-align: right; }
.board { padding: 0; margin: 0; list-style: none; counter-reset: b; display: flex; flex-direction: column; gap: 3px; }
.board li { display: grid; grid-template-columns: minmax(0, 1fr) auto 80px; gap: 10px; padding: 4px 8px; background: var(--plum); font-size: 14px; }
.board li.me { outline: 1px solid var(--lamp); }
.board b { text-align: right; }
.board .num { font-size: 13px; }
.maillist { list-style: none; padding: 0; margin: 0; font-size: 13.5px; display: flex; flex-direction: column; gap: 6px; }
.maillist .dim { font-size: 11.5px; display: block; }
.danger-zone { margin-top: 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13.5px; }

/* Dock */
#dock { flex: none; background: var(--plum); border-top: 2px solid var(--line); position: relative; }
#stripWrap { position: relative; height: 132px; overflow: hidden; background: #111; }
#strip { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
#lbl { position: absolute; left: var(--gut-l); top: 5px; pointer-events: none; font-family: var(--pixel); text-shadow: 1px 1px 0 #161220, -1px 1px 0 #161220, 1px -1px 0 #161220, -1px -1px 0 #161220; color: #fff; line-height: 1.15; }
#lblStage { font-size: 20px; display: block; }
#lblWave { font-size: 17px; }
#feed { position: absolute; right: var(--gut-r); top: 5px; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; pointer-events: none; max-width: 62%; }
.find { background: rgba(22,18,32,.9); border-left: 3px solid var(--c, var(--line)); padding: 1px 8px; font-size: 13px; animation: slide .18s ease-out; color: var(--text); }
.find.warn { border-left-color: var(--bad); color: #ffd9d2; }
.find.good { border-left-color: var(--good); }
.find.big { font: 400 20px/1.1 var(--pixel); color: var(--c, var(--lamp)); padding: 3px 10px; }
@keyframes slide { from { transform: translateX(10px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .find { animation: none; } }
#tray { display: flex; align-items: center; gap: 12px; padding-block: 6px; padding-left: var(--gut-l); padding-right: var(--gut-r); flex-wrap: wrap; }
.nav { display: flex; align-items: center; gap: 4px; }
.nav .btn { padding: 3px 9px; }
#holdBtn[aria-pressed="true"] { background: var(--text); color: var(--ink); }
#chestBtn { display: flex; align-items: center; gap: 7px; padding: 3px 10px 3px 5px; }
#chestBtn img { width: 22px; height: 22px; }
#chestBtn.ready { background: var(--lamp); color: #231807; border-color: #b98419; font-weight: 700; }
#chestBtn b { font-family: var(--mono); }
.timer { flex: 1 1 110px; min-width: 100px; max-width: 280px; font-size: 12.5px; color: var(--dim); }
.timer div { height: 5px; background: var(--ink); margin-top: 2px; }
.timer i { display: block; height: 100%; background: var(--lamp); width: 0; }
#clock { margin-left: auto; font: 500 14px var(--mono); color: var(--dim); }

@media (max-width: 860px) {
  .split, .split.even { grid-template-columns: minmax(0, 1fr); }
  .col-side { position: static; order: -1; }
  .hide-s { display: none; }
  .lslots { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .brand { font-size: 25px; }
  .purse small { display: none; }
  #stripWrap { height: 110px; }
  h2 { font-size: 27px; }
  .stats { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  #clock { display: none; }
}
</style>
<div id="app">
  <header id="top">
    <div class="brand">Trayfarers</div>
    <div class="wallet">
      <div class="purse"><b id="hudCoin">0</b><small>coin</small></div>
      <div class="purse marks"><b id="hudMarks">0</b><small>Marks</small></div>
    </div>
  </header>
  <nav id="tabs" aria-label="Game sections">
    <button data-tab="crew" aria-selected="true">Crew</button>
    <button data-tab="pack">Pack</button>
    <button data-tab="forge">Forge</button>
    <button data-tab="exchange">Exchange</button>
    <button data-tab="almanac">Almanac</button>
    <button data-tab="ledger">Ledger</button>
  </nav>
  <p id="hint" hidden></p>
  <main id="panel" tabindex="-1"><p class="empty inner">Your crew is packing up.</p></main>
  <footer id="dock">
    <div id="stripWrap">
      <canvas id="strip" aria-label="Your crew walking the road and fighting" role="img"></canvas>
      <div id="lbl"><span id="lblStage"></span><span id="lblWave"></span></div>
      <div id="feed" aria-live="polite"></div>
    </div>
    <div id="tray">
      <div class="nav">
        <button class="btn" data-act="stagePrev" aria-label="Previous stage">&lsaquo;</button>
        <button class="btn" data-act="stageNext" aria-label="Next stage">&rsaquo;</button>
        <button class="btn" id="holdBtn" data-act="hold" aria-pressed="false">Hold here</button>
      </div>
      <button class="btn" id="chestBtn" data-act="openChest" disabled><img class="px" id="chestIcon" alt=""><span>Open chest</span><b id="chestCount">0/6</b></button>
      <div class="timer"><span id="chestNext">Next chest</span><div><i id="chestFill"></i></div></div>
      <div id="clock"></div>
    </div>
  </footer>
</div>
<div id="tip" hidden></div>
<script>// Trayfarers game engine. Pure game rules with no DOM access, so the same file
// runs in the browser and in test/sim.mjs. Every time-dependent call takes `now`.
(function (root) {
'use strict';

const MIN = 60e3, HOUR = 3600e3;

const CFG = {
  CHEST_BASE: 90,            // seconds between timed chests
  CHEST_CAP: 6,
  PACK_CAP: 120,
  OFFLINE_RATE: 0.5,         // share of online income paid while away (coin and XP only)
  OFFLINE_BASE_H: 1,
  LIST_GATE: 3,              // forge level needed to list on the Exchange
  LIST_SLOTS: 4,
  LIST_COOLDOWN: 4 * HOUR,
  RESALE_LOCK: 24 * HOUR,
  FEE_HOUSE: 0.05,
  FEE_FOUNDER: 0.10,
  FLOOR: 3,                  // lowest legal price: 1 house + 1 founder + 1 seller
  DRIFT_SPREAD: 1.12,        // drifters ask this much above reference
  START_MARKS: 100,
  STRIP_GATE: 4, ETCH_GATE: 4,
};

// ---------------------------------------------------------------- tables
const GRADES = [
  { n: 'Scrap',    c: '#a8a39a', salv: 10,    fx: 2,    sock: 0, mult: 1,    price: .6,  hazard: 0.08, affix: 0 },
  { n: 'Sturdy',   c: '#86c46b', salv: 30,    fx: 6,    sock: 1, mult: 1.25, price: .8,  hazard: 0.08, affix: 0 },
  { n: 'Fine',     c: '#57b3d9', salv: 95,    fx: 18,   sock: 1, mult: 1.55, price: 1.2, hazard: 0.10, affix: 1 },
  { n: 'Prized',   c: '#e8b03f', salv: 300,   fx: 55,   sock: 2, mult: 1.95, price: 3,   hazard: 0.20, affix: 1 },
  { n: 'Relic',    c: '#e8674f', salv: 950,   fx: 170,  sock: 2, mult: 2.45, price: 16,  hazard: 0.20, affix: 2 },
  { n: 'Mythic',   c: '#bb82ec', salv: 3000,  fx: 550,  sock: 3, mult: 3.1,  price: 100, hazard: 0.12, affix: 3 },
  { n: 'Astral',   c: '#57e0c4', salv: 9500,  fx: 1700, sock: 3, mult: 3.9,  price: 650, hazard: 0.06, affix: 3 },
  { n: 'Primeval', c: '#fff1a8', salv: 30000, fx: 5500, sock: 3, mult: 5,    price: 6000, hazard: 0.03, affix: 4 },
];
const CHEST_WEIGHTS = [620, 270, 85, 20, 4, 0.8, 0.12, 0.012];

const SLOTS = ['weapon', 'ward', 'helm', 'coat', 'boots', 'charm'];

// ---------------------------------------------------------------- helpers
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function h32(...parts) {
  let h = 0x811c9dc5;
  for (const p of parts) {
    const s = String(p);
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    h ^= 0xff; h = Math.imul(h, 16777619);
  }
  h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); h ^= h >>> 15;
  return h >>> 0;
}
const u01 = (...p) => h32(...p) / 4294967296;
function rand(G) {
  let t = (G.rng = (G.rng + 0x6D2B79F5) | 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function pick(table, r) {
  let acc = 0;
  for (const [v, w] of table) { acc += w; if (r < acc) return v; }
  return table[table.length - 1][0];
}
function noise1(seed, x) {
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  return (u01(seed, i) * (1 - u) + u01(seed, i + 1) * u) * 2 - 1;
}

// ---------------------------------------------------------------- stages
function stageInfo(i) {
  const d = Math.floor(i / 30), r = Math.floor((i % 30) / 6), n = i % 6 + 1;
  return { i, d, r, n, boss: n === 6, lvl: i + 1, name: `${REGIONS[r].n} ${n}`, diff: DIFFS[d] };
}
const monHp = L => 9 * 1.125 ** (L - 1) + (L - 1) * 3;
const monDmg = L => 1.5 * 1.098 ** (L - 1);
const monCoin = L => 2 * 1.075 ** (L - 1);
const monXp = L => 3 * 1.085 ** (L - 1);
const xpNeed = l => Math.round(20 * 1.2 ** l);
const LEVEL_CAP = 80;
const forgeNeed = l => Math.round(8 * l ** 1.4);

// ---------------------------------------------------------------- items
const bandOf = l => clamp(Math.floor((l - 1) / 12), 0, 7);
const budget = (l, g) => (4 + l * 1.7) * GRADES[g].mult;
const itemName = it => `${BANDS[bandOf(it.l)]} ${SLOT_NAME[it.s]}`;
const marketKey = it => `${it.s}.${bandOf(it.l)}.${it.g}`;

function itemStats(it) {
  const out = { atk: 0, hp: 0, armor: 0, crit: 0, haste: 0, coin: 0, xp: 0, chest: 0 };
  const b = budget(it.l, it.g);
  const base = SLOT_BASE[it.s];
  for (const k in base) out[k] += base[k] * b;
  for (let i = 0; i < GRADES[it.g].affix; i++) {
    const a = AFFIXES[h32(it.r, 'affix', i) % AFFIXES.length];
    out[a.k] += a.per * (it.g + 1) * (0.7 + 0.6 * u01(it.r, 'roll', i));
  }
  for (const [tier, stat] of it.e || []) {
    const v = b * [.10, .20, .40][tier];
    if (stat === 0) out.atk += v * .55;
    else if (stat === 1) out.hp += v * 3;
    else out.armor += v * .7;
  }
  for (const k of ['atk', 'hp', 'armor']) out[k] = Math.round(out[k]);
  return out;
}
function makeItem(G, s, l, g, extra) {
  return Object.assign({ id: 'i' + (G.nextId++).toString(36), s, l: clamp(Math.round(l), 1, STAGE_COUNT), g, r: Math.floor(rand(G) * 4294967296), e: [], k: 0, t: 0 }, extra || {});
}
function randomSlot(G) { return SLOTS[Math.floor(rand(G) * SLOTS.length)]; }

// ---------------------------------------------------------------- game state
function newGame(now, seed) {
  seed = seed === undefined ? (now ^ Math.floor(Math.random() * 1e9)) >>> 0 : seed;
  const G = {
    v: 1, seed, rng: seed | 0, nextId: 1, crew: 'Crew ' + (seed % 9000 + 1000),
    createdAt: now, lastSeen: now,
    coin: 150, marks: CFG.START_MARKS,
    stage: 0, maxStage: 0, hold: false,
    party: ['warden'],
    heroes: {},
    items: [],
    mats: { seal: 2, gem1: 2, gem2: 0, gem3: 0 },
    chests: [], chestT: 20,
    forge: { lvl: 1, xp: 0 },
    talents: {},
    market: { mine: [], slots: new Array(CFG.LIST_SLOTS).fill(0), drift: {} },
    ledger: { coinKills: 0, coinSalvage: 0, coinAway: 0, coinTalents: 0, coinForge: 0, itemsMade: 0, itemsBurned: 0, marksIn: 0, marksOut: 0, feeHouse: 0, feeFounder: 0, sold: 0, bought: 0 },
    mail: [], stats: { kills: 0, chests: 0, best: 0, wipes: 0, boss: 0 },
    hints: {},
  };
  for (const k of HERO_KEYS) G.heroes[k] = { lvl: 1, xp: 0, gear: {} };
  // Starter crate, so the forge and Exchange can be tried in the first minutes.
  for (let i = 0; i < 9; i++) addItem(G, makeItem(G, randomSlot(G), 1, 0), now, true);
  for (let i = 0; i < 2; i++) addItem(G, makeItem(G, randomSlot(G), 1, 1), now, true);
  const blade = makeItem(G, 'weapon', 1, 1); addItem(G, blade, now, true); equip(G, 'warden', blade.id);
  const coat = makeItem(G, 'coat', 1, 1); addItem(G, coat, now, true); equip(G, 'warden', coat.id);
  addItem(G, makeItem(G, 'charm', 4, 3), now, true);
  G.stats.best = 3;
  mail(G, now, 'A drifter left you a starter crate: scrap for the forge, two seals, and a Prized charm worth selling.', 'gift');
  return G;
}
function mail(G, now, text, kind) {
  G.mail.unshift({ at: now, text, kind: kind || 'note' });
  if (G.mail.length > 40) G.mail.length = 40;
}
const talent = (G, k) => G.talents[k] || 0;
const partySize = G => 1 + talent(G, 'slot');
const packCap = G => CFG.PACK_CAP + talent(G, 'pack') * 20;
const chestCap = G => CFG.CHEST_CAP + talent(G, 'cap') * 2;

function addItem(G, it, now, silent) {
  if (G.items.length >= packCap(G)) { salvageValue(G, it); G.ledger.itemsMade++; G.ledger.itemsBurned++; return null; }
  G.items.push(it);
  if (!silent) G.ledger.itemsMade++;
  if (it.g > G.stats.best) G.stats.best = it.g;
  return it;
}
function salvageValue(G, it) {
  const coin = Math.round(GRADES[it.g].salv * (1 + .1 * talent(G, 'salvage')) * (1 + it.l * .02));
  G.coin += coin; G.ledger.coinSalvage += coin;
  forgeXp(G, GRADES[it.g].fx);
  return coin;
}
function forgeXp(G, xp) {
  G.forge.xp += xp;
  while (G.forge.xp >= forgeNeed(G.forge.lvl)) { G.forge.xp -= forgeNeed(G.forge.lvl); G.forge.lvl++; G.justForged = G.forge.lvl; }
}
const findItem = (G, id) => G.items.find(i => i.id === id);
function equippedBy(G, id) {
  for (const h of HERO_KEYS) for (const s of SLOTS) if (G.heroes[h].gear[s] === id) return h;
  return null;
}
function equip(G, hero, id) {
  const it = findItem(G, id); if (!it) return false;
  for (const h of HERO_KEYS) for (const s of SLOTS) if (G.heroes[h].gear[s] === id) delete G.heroes[h].gear[s];
  G.heroes[hero].gear[it.s] = id; G.statsDirty = true; return true;
}
function unequip(G, hero, slot) { delete G.heroes[hero].gear[slot]; G.statsDirty = true; }
function heroScore(hero, st) {
  const w = HEROES[hero].w;
  return st.atk * w.atk + st.hp * w.hp + st.armor * w.armor + st.crit * 2 + st.haste * 2 + st.coin + st.xp + st.chest * 2;
}
function equipBest(G, hero) {
  for (const s of SLOTS) {
    let best = null, bestScore = -1;
    for (const it of G.items) {
      if (it.s !== s) continue;
      const by = equippedBy(G, it.id);
      if (by && by !== hero) continue;
      const sc = heroScore(hero, itemStats(it));
      if (sc > bestScore) { best = it; bestScore = sc; }
    }
    if (best) G.heroes[hero].gear[s] = best.id;
  }
  G.statsDirty = true;
}
function heroStats(G, key) {
  const H = HEROES[key], me = G.heroes[key], l = me.lvl;
  const s = { hp: H.hp * (1 + .12 * (l - 1)), atk: H.atk * (1 + .10 * (l - 1)), armor: H.armor * (1 + .05 * (l - 1)), crit: H.crit, aspd: H.aspd, range: H.range };
  let haste = 0;
  for (const slot of SLOTS) {
    const it = findItem(G, me.gear[slot]); if (!it) continue;
    const st = itemStats(it);
    s.hp += st.hp; s.atk += st.atk; s.armor += st.armor; s.crit += st.crit / 100; haste += st.haste / 100;
  }
  s.atk *= 1 + .06 * talent(G, 'might');
  s.hp *= 1 + .06 * talent(G, 'grit');
  s.armor *= 1 + .06 * talent(G, 'grit');
  s.aspd *= 1 + haste;
  s.hp = Math.round(s.hp); s.atk = Math.round(s.atk * 10) / 10; s.armor = Math.round(s.armor);
  return s;
}
function partyBonus(G) {
  const b = { coin: 0, xp: 0, chest: 0 };
  for (const key of G.party) {
    const me = G.heroes[key];
    for (const slot of SLOTS) {
      const it = findItem(G, me.gear[slot]); if (!it) continue;
      const st = itemStats(it);
      b.coin += st.coin; b.xp += st.xp; b.chest += st.chest;
    }
  }
  return b;
}
function partyPower(G) {
  let p = 0;
  for (const k of G.party) { const s = heroStats(G, k); p += s.atk * s.aspd * (1 + s.crit * .6) * 6 + s.hp * .4 + s.armor * .6; }
  return Math.round(p);
}

// ---------------------------------------------------------------- chests and loot
function rollGrade(G, stage, boss) {
  const shift = 1 + (stage / (STAGE_COUNT - 1)) * 1.0 + (boss ? .5 : 0);
  let total = 0;
  const w = CHEST_WEIGHTS.map((x, g) => { const v = (boss && g === 0) ? 0 : x * shift ** g; total += v; return v; });
  let r = rand(G) * total;
  for (let g = 0; g < w.length; g++) { r -= w[g]; if (r < 0) return g; }
  return 0;
}
function openChest(G, now) {
  const ch = G.chests.shift(); if (!ch) return null;
  G.stats.chests++;
  const L = ch.stage + 1;
  const out = [];
  const r = rand(G);
  if (r < (ch.boss ? .15 : .35)) {
    const m = rand(G);
    const key = m < .4 ? 'seal' : m < .78 ? 'gem1' : m < .96 ? 'gem2' : 'gem3';
    const qty = key === 'seal' ? 1 + Math.floor(rand(G) * 2) : 1;
    G.mats[key] += qty;
    out.push({ mat: key, qty });
  } else {
    const it = makeItem(G, randomSlot(G), L - Math.floor(rand(G) * 2), rollGrade(G, ch.stage, ch.boss));
    addItem(G, it, now);
    out.push({ item: it });
  }
  return { chest: ch, loot: out };
}
function salvage(G, id) {
  const it = findItem(G, id); if (!it || it.k || equippedBy(G, id)) return 0;
  G.items = G.items.filter(i => i !== it);
  G.ledger.itemsBurned++;
  return salvageValue(G, it);
}
function salvageUpTo(G, maxGrade) {
  let coin = 0, n = 0;
  for (const it of G.items.slice()) {
    if (it.g <= maxGrade && !it.k && !equippedBy(G, it.id)) { coin += salvage(G, it.id); n++; }
  }
  return { coin, n };
}
function fuseCandidates(G, g) {
  return G.items.filter(i => i.g === g && !i.k && !equippedBy(G, i.id) && !(i.e && i.e.length)).sort((a, b) => a.l - b.l);
}
function fuse(G, g, slotChoice) {
  if (g >= FUSE.length) return { err: 'That grade cannot be fused further.' };
  if (G.forge.lvl < FUSE_GATE[g]) return { err: `Needs Forge level ${FUSE_GATE[g]}.` };
  const pool = fuseCandidates(G, g);
  if (pool.length < 9) return { err: `Needs 9 unlocked ${GRADES[g].n} items. You have ${pool.length}.` };
  if (G.coin < FUSE[g].cost) return { err: `Needs ${FUSE[g].cost} coin.` };
  const used = pool.slice(0, 9);
  G.coin -= FUSE[g].cost; G.ledger.coinForge += FUSE[g].cost;
  G.items = G.items.filter(i => !used.includes(i));
  G.ledger.itemsBurned += 9;
  const to = pick(FUSE[g].to, rand(G));
  const l = used.reduce((a, b) => a + b.l, 0) / 9;
  const it = makeItem(G, slotChoice || randomSlot(G), l, to);
  addItem(G, it);
  forgeXp(G, GRADES[g].fx * 3);
  return { item: it, stayed: to === g, jumped: to > g + 1 };
}
function etch(G, id, tier, stat) {
  const it = findItem(G, id);
  if (!it) return { err: 'Item not found.' };
  if (G.forge.lvl < CFG.ETCH_GATE) return { err: `Etching opens at Forge level ${CFG.ETCH_GATE}.` };
  if ((it.e || []).length >= GRADES[it.g].sock) return { err: 'No free sockets on this item.' };
  if (tier === 1 && it.g < 3) return { err: 'Cut Gems need Prized gear or better.' };
  if (tier === 2 && it.g < 5) return { err: 'Flawless Gems need Mythic gear or better.' };
  const key = 'gem' + (tier + 1);
  if (G.mats[key] < 1) return { err: `You have no ${MATS[key].n}.` };
  G.mats[key]--;
  it.e = (it.e || []).concat([[tier, stat]]);
  G.statsDirty = true;
  return { ok: true };
}
const stripCost = it => (it.e || []).reduce((a, [t]) => a + Math.round(100 * 3 ** t), 0);
function strip(G, id) {
  const it = findItem(G, id);
  if (!it || !(it.e || []).length) return { err: 'Nothing to strip.' };
  if (G.forge.lvl < CFG.STRIP_GATE) return { err: `Stripping opens at Forge level ${CFG.STRIP_GATE}.` };
  const c = stripCost(it);
  if (G.coin < c) return { err: `Stripping costs ${c} coin.` };
  G.coin -= c; G.ledger.coinForge += c; it.e = []; G.statsDirty = true;
  return { ok: true, cost: c };
}
function buyTalent(G, k) {
  const t = talentDef(k), r = talent(G, k);
  if (r >= t.max) return { err: 'Already at the top rank.' };
  const cost = Math.round(t.cost(r));
  if (G.coin < cost) return { err: `Needs ${cost} coin.` };
  G.coin -= cost; G.ledger.coinTalents += cost; G.talents[k] = r + 1; G.statsDirty = true;
  return { ok: true };
}
function toggleParty(G, key) {
  const i = G.party.indexOf(key);
  if (i >= 0) { if (G.party.length === 1) return { err: 'Someone has to walk the road.' }; G.party.splice(i, 1); }
  else { if (G.party.length >= partySize(G)) return { err: 'Roster full. Buy Crew Roster in the Almanac.' }; G.party.push(key); }
  G.statsDirty = true;
  return { ok: true };
}

// ---------------------------------------------------------------- battle
function newBattle(G) {
  const B = { t: 0, scroll: 0, mons: [], hs: [], fx: [], wave: 0, delay: 1.2, state: 'march', retry: 0, nextMon: 1, spawnDist: 150 };
  syncParty(G, B);
  enterStage(G, B);
  return B;
}
function syncParty(G, B) {
  const prev = {}; for (const h of B.hs) prev[h.key] = h;
  B.hs = G.party.map((key, idx) => {
    const st = heroStats(G, key), old = prev[key];
    const hp = old ? Math.min(st.hp, old.hp + Math.max(0, st.hp - old.mhp)) : st.hp;
    return { key, idx, st, mhp: st.hp, hp: old && old.down ? 0 : hp, cd: old ? old.cd : .3 + idx * .2, down: old ? old.down : 0, swing: 0 };
  });

      const snap = await Net.db.doc(`data/users/${Net.uid}/save`).get();
      if (snap.exists) {
        const s = JSON.parse(snap.data().json);
        if (s && s.lastSeen > Net.localSeen) { adopt(s); const r = T.applyAway(G, Date.now()); saveLocal(); say(r ? `Loaded your cloud save. ${short(r.coin)} coin came in while you were away.` : 'Loaded your cloud save.'); }
      }
    }
    Net.db.collection('listings').limit(500).onSnapshot(onListings, () => { Net.status = 'solo'; touch(); });
    Net.db.collection('board').orderBy('worth', 'desc').limit(20).onSnapshot(s => {
      Net.board = s.docs.map(d => { const v = d.data(); return { id: d.id, crew: String(v.crew || 'Crew').slice(0, 24), worth: Math.max(0, +v.worth || 0), stage: Math.max(0, +v.stage || 0) }; });
      if (ui.tab === 'ledger') touch();
    }, () => {});
    touch();
  } catch (e) { Net.status = 'solo'; }
}
function onListings(snap) {
  Net.peers.clear(); ui.peerKeys = {};

    if (!l) continue;
    if (l.seller === Net.uid) { if (l.status === 'sold') settleShared(l); continue; }
    if (l.status === 'open') { Net.peers.set(l.id, l); ui.peerKeys[l.key] = (ui.peerKeys[l.key] || 0) + 1; }

}
function settleShared(l) {

  if (rec) {
    T.settleSale(G, rec, l.buyerCrew || 'Another crew', Date.now());
    say(`Sold for ${rec.price} Marks.`, 'good');
    saveLocal(); saveCloud(true); touch();

}
function publishListing(rec) {

  const body = { seller: Net.uid, crew: G.crew, price: rec.price, at: rec.at, status: 'open' };
  if (rec.item) body.item = rec.item; else { body.mat = rec.mat; body.qty = rec.qty; }
  rec.shared = true;

}
async function cancelMine(id) {
  const rec = G.market.mine.find(r => r.id === id); if (!rec) return;
  if (rec.shared && Net.db) {
    try {
      const ref = Net.db.doc('listings/' + id);
      const lease = await ref.acquire({ holder: Net.uid, ttlMs: 4000 });
      if (!lease.acquired) return say('A buyer is checking out this listing. Try again in a moment.', 'warn');
      const snap = await ref.get();
      if (snap.exists && snap.data().status === 'sold') return say('Too late. That one just sold.', 'warn');
      await ref.delete();
    } catch (e) { return say('The market could not be reached. Try again.', 'warn'); }
  }

}
async function buyPeer(id) {
  const l = Net.peers.get(id); if (!l) return say('That listing is gone.', 'warn');
  if (!Net.canWrite) return say('This link lets you read the market but not trade on it.', 'warn');
  if (G.marks < l.price) return say(`Needs ${fmt(l.price)} Marks.`, 'warn');
  try {
    const ref = Net.db.doc('listings/' + id);
    const lease = await ref.acquire({ holder: Net.uid, ttlMs: 4000 });
    if (!lease.acquired) return say('Someone else is buying this right now.', 'warn');
    const snap = await ref.get();
    const fresh = snap.exists ? T.sanitizeListing(id, snap.data()) : null;
    if (!fresh || fresh.status !== 'open' || fresh.price !== l.price) return say('That listing just changed. Check it again.', 'warn');
    await ref.update({ status: 'sold', buyer: Net.uid, buyerCrew: G.crew, soldAt: Date.now() });
    const now = Date.now();
    G.marks -= fresh.price; G.ledger.marksOut += fresh.price; G.ledger.bought++;
    if (fresh.mat) G.mats[fresh.mat] += fresh.qty;
    else T.addItem(G, Object.assign(T.makeItem(G, fresh.item.s, fresh.item.l, fresh.item.g), { r: fresh.item.r, t: now + CFG.RESALE_LOCK }), now);
    T.mail(G, now, `You bought ${T.keyName(fresh.key)} from ${fresh.crew} for ${fresh.price} Marks.`, 'buy');
    act(null, 'Bought. It is in your Pack.'); saveCloud(true);
  } catch (e) { say('The market could not be reached. Try again.', 'warn'); }
}
function marketTick() {
  const now = Date.now();
  const due = T.dueDrifterSales(G, now, k => ui.peerKeys[k] || 0);
  for (const rec of due) {
    if (rec.shared && Net.db) {
      Net.db.doc('listings/' + rec.id).update({ status: 'sold', buyer: 'drifter', buyerCrew: 'A drifter', soldAt: now }).catch(() => {
        T.settleSale(G, rec, 'A drifter', Date.now()); touch();
      });
    } else {
      T.settleSale(G, rec, 'A drifter', now);
      say(`A drifter paid ${rec.price} Marks for your listing.`, 'good');
      touch();

}

// ---------------------------------------------------------------- strip renderer
const cv = () => $('strip');
let ctx, anchor = 80, beams = [];
function sizeStrip() {
  const c = cv(), r = c.getBoundingClientRect();
  const scale = r.height / 44;
  c.width = Math.max(120, Math.ceil(r.width / scale)); c.height = 44;
  ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false;
  anchor = Math.max(48, Math.round(c.width * .36));
}
const monX = x => {
  const W = cv().width, near = 40;
  return x <= near ? x : near + (x - near) * ((W - anchor - near + 10) / (B.spawnDist - near));
};
function tile(img, off) {
  const W = cv().width;
  let x = -Math.floor(off) % img.width;
  if (x > 0) x -= img.width;
  for (; x < W; x += img.width) ctx.drawImage(img, x, 0);
}
function drawStrip() {
  if (!ctx) return;
  const c = cv(), W = c.width, H = c.height, info = B.info;
  const S = A.buildScene(info.r, info.d, H), gy = S.groundY + 2;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const scroll = B.scroll;
  ctx.drawImage(S.sky, 0, 0, W, H, 0, 0, W, H);
  if (W > S.W) tile(S.sky, 0);
  tile(S.far, scroll * .15); tile(S.mid, scroll * .4); tile(S.ground, scroll);
  if (S.tint) { ctx.fillStyle = S.tint; ctx.fillRect(0, 0, W, H); }
  const tick = Math.floor(B.t * 5);
  const walking = !B.mons.some(m => m.x < 95) && B.state !== 'regroup';

  // Chests waiting in the cart.
  const chestN = Math.min(G.chests.length, 3);
  for (let i = 0; i < chestN; i++) A.drawChest(ctx, Math.max(2, anchor - 62) - i * 3, gy - i * 3, tick % 6 < 3 ? '#fff1a8' : '#f4b942');

  if (B.state === 'regroup') {
    ctx.fillStyle = tick % 2 ? '#f4b942' : '#e8674f';
    ctx.fillRect(anchor + 8, gy - 3, 3, 3); ctx.fillStyle = '#fff1a8'; ctx.fillRect(anchor + 9, gy - 4 - tick % 2, 1, 2);
  }
  B.hs.slice().reverse().forEach(h => {
    const x = anchor + (-h.idx * 15) - 8, gear = G.heroes[h.key].gear;
    const weapon = T.findItem(G, gear.weapon);
    const down = h.hp <= 0;
    if (down) { ctx.fillStyle = HEROES[h.key].cloak; ctx.fillRect(x + 1, gy - 3, 10, 3); ctx.fillStyle = HEROES[h.key].hood; ctx.fillRect(x + 8, gy - 4, 4, 4); return; }
    A.drawTraveller(ctx, h.key, HEROES[h.key], x, gy, walking && !reduced ? tick % 2 : 0, { still: !walking, swing: h.swing, weapon: weapon ? GRADES[weapon.g].c : null });
    bar(x + 1, gy - 15, 9, h.hp / h.mhp, '#86c46b');
  });
  for (const m of B.mons) {
    const scale = m.boss ? 2 : 1, floaty = m.shape === 'moth' || m.shape === 'wisp';
    const sx = Math.round(anchor + monX(m.x)) - (m.lunge > 0 ? 2 : 0);
    const y = gy - (floaty ? 4 + (reduced ? 0 : Math.round(Math.sin(B.t * 3 + m.id) * 1.5)) : 0);
    A.drawMon(ctx, m, sx, y, tick, scale);
    if (!m.boss) bar(sx + 1, y - 11, 9, m.hp / m.mhp, '#e8674f');
  }
  const boss = B.mons.find(m => m.boss);
  if (boss) {
    const w = Math.min(120, W - 40), x = Math.round((W - w) / 2);
    ctx.fillStyle = '#161220'; ctx.fillRect(x - 1, 3, w + 2, 4);
    ctx.fillStyle = '#e8674f'; ctx.fillRect(x, 4, Math.round(w * Math.max(0, boss.hp / boss.mhp)), 2);
  }
  for (const f of B.fx) {
    if (f.t === 'num') {
      const col = f.crit ? '#f4b942' : '#ffffff', y = Math.round(gy - 18 - f.age * 12);
      A.drawNum(ctx, A.compactNum(f.v), Math.round(anchor + monX(f.x)) + 2, y + 1, '#161220');
      A.drawNum(ctx, A.compactNum(f.v), Math.round(anchor + monX(f.x)) + 2, y, col);
    } else if (f.t === 'coin') {
      ctx.fillStyle = '#f4b942'; ctx.fillRect(Math.round(anchor + monX(f.x)) + 4 - f.age * 18, Math.round(gy - 6 - f.age * 16), 2, 2);
    } else if (f.t === 'shot' && f.age < .14) {
      const from = anchor + f.from, to = anchor + monX(f.x) + 4, x = from + (to - from) * (f.age / .14);
      ctx.fillStyle = f.heal ? '#fff1a8' : '#efe7d8'; ctx.fillRect(Math.round(x), gy - 7, 4, 1);
    } else if (f.t === 'hex' && f.age < .3) {
      const r = Math.round(3 + f.age * 34), cx = Math.round(anchor + monX(f.x)) + 5, cy = gy - 5;
      ctx.fillStyle = '#bb82ec';
      for (let a = 0; a < 12; a++) ctx.fillRect(cx + Math.round(Math.cos(a / 12 * 6.28) * r), cy + Math.round(Math.sin(a / 12 * 6.28) * r * .5), 1, 1);
    } else if (f.t === 'heal') {
      const hx = anchor + (-f.idx * 15) - 4;
      A.drawNum(ctx, '+', hx, Math.round(gy - 20 - f.age * 8), '#86c46b');
    }
  }
  beams = beams.filter(b => (b.age += 1 / 60) < 1.3);
  for (const b of beams) {
    ctx.globalAlpha = Math.max(0, 1 - b.age / 1.3) * .75;
    ctx.fillStyle = b.color; ctx.fillRect(b.x, 0, 7, gy);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(b.x + 3, 0, 1, gy);
    ctx.globalAlpha = 1;
  }
}
function bar(x, y, w, frac, color) {
  ctx.fillStyle = '#161220'; ctx.fillRect(x - 1, y - 1, w + 2, 3);
  ctx.fillStyle = color; ctx.fillRect(x, y, Math.max(0, Math.round(w * frac)), 1);
}

// ---------------------------------------------------------------- game loop
let lastT = performance.now(), acc = 0, secTick = 0;
function advance() {
  const t = performance.now();
  let dt = (t - lastT) / 1000; lastT = t;
  if (dt > 120) {
    G.lastSeen = Date.now() - dt * 1000;
    const r = T.applyAway(G, Date.now());
    if (r) say(`Back on the road. Your crew earned ${short(r.coin)} coin while the tab slept.`);
    touch();
    return;
  }
  acc += dt;
  const now = Date.now();
  while (acc >= .1) {
    acc -= .1;
    for (const e of T.step(G, B, .1, now)) handleEvent(e, now);
  }
  secTick += dt;
  if (secTick >= 1) { secTick = 0; perSecond(now); }
  if (G.justForged) { say(`Forge reached level ${G.justForged}.`, 'good'); G.justForged = 0; touch(); }
}
function handleEvent(e, now) {
  if (e.t === 'chest') { touch(); }
  else if (e.t === 'opened') announceLoot(e.r);
  else if (e.t === 'loot') { say(`${GRADES[e.item.g].n} ${T.itemName(e.item)}`, '', GRADES[e.item.g].c); touch(); }
  else if (e.t === 'level') { say(`${HEROES[e.hero].n} reached level ${e.lvl}.`); touch(); }
  else if (e.t === 'bossDown') { say(`${e.name} is down. A boss chest is in the cart.`, 'big', '#f4b942'); saveLocal(); touch(); }
  else if (e.t === 'wipe') { say(`Your crew fell at ${e.info.name}. Falling back to regroup.`, 'warn'); touch(); }
  else if (e.t === 'clear') { touch(); }
}
function announceLoot(r) {
  if (!r) return;
  for (const l of r.loot) {
    if (l.mat) say(`${l.qty} × ${MATS[l.mat].n}`, '', MATS[l.mat].c);
    else {
      const g = l.item.g, col = GRADES[g].c;
      say(`${GRADES[g].n} ${T.itemName(l.item)}`, g >= 4 ? 'big' : '', col);
      if (g >= 3) beams.push({ x: Math.max(2, anchor - 62), color: col, age: 0 });
      if (g >= 4) T.mail(G, Date.now(), `Found a ${GRADES[g].n} ${T.itemName(l.item)} in a chest.`, 'find');
    }
  }
  touch();
}
let lastRender = 0, lastMarket = 0;
function perSecond(now) {
  G.lastSeen = now;
  updateHud(now);
  if (now - lastMarket > 20e3) { lastMarket = now; marketTick(); }
  if (Math.floor(now / 1000) % 15 === 0) { saveLocal(); saveCloud(); pushBoard(); }
  if ((ui.tab === 'crew' || ui.tab === 'exchange') && now - lastRender > 3000) touch();
}
function maybeRender() {
  if (!ui.dirty || ui.pressing) return;
  const a = document.activeElement;
  if (a && $('panel').contains(a) && (a.tagName === 'INPUT' || a.tagName === 'SELECT')) return;
  ui.dirty = false; lastRender = Date.now();
  renderPanel();
}
function frame() {
  advance(); drawStrip(); maybeRender();
  requestAnimationFrame(frame);
}
function updateHud(now) {
  now = now || Date.now();
  $('hudCoin').textContent = short(G.coin);
  $('hudMarks').textContent = fmt(G.marks);
  const info = B.info;
  $('lblStage').textContent = `${info.diff} · ${info.name}`;
  const boss = B.mons.find(m => m.boss);
  $('lblWave').textContent = B.state === 'regroup' ? 'Regrouping at camp' : boss ? boss.name : info.boss ? `Boss gate · wave ${Math.min(B.wave, B.waves)} of ${B.waves}` : `Wave ${Math.min(B.wave, B.waves)} of ${B.waves}`;
  const cap = T.chestCap(G);
  $('chestCount').textContent = `${G.chests.length}/${cap}`;
  const btn = $('chestBtn'); btn.disabled = !G.chests.length; btn.classList.toggle('ready', G.chests.length > 0);
  const full = G.chests.length >= cap;
  const pct = full ? 100 : Math.round((1 - G.chestT / CFG.CHEST_BASE) * 100);
  $('chestFill').style.width = Math.max(0, Math.min(100, pct)) + '%';
  const rate = B.bonus ? B.bonus.chest : 1;
  $('chestNext').textContent = full ? 'Cart is full' : `Next chest ${clock(G.chestT / rate * 1000)}`;
  $('holdBtn').setAttribute('aria-pressed', G.hold ? 'true' : 'false');
  $('holdBtn').textContent = G.hold ? 'Holding' : 'Hold here';
  const d = new Date(now);
  $('clock').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  $('hint').textContent = nextHint();
  $('hint').hidden = !$('hint').textContent;
}
function nextHint() {
  const listed = G.market.mine.length || G.ledger.sold;
  if (G.stats.chests === 0 && G.chests.length) return 'Your first chest is in the cart. Open it from the tray below.';
  if (G.forge.lvl < CFG.LIST_GATE) return `Salvage spare gear in the Pack to reach Forge level ${CFG.LIST_GATE}. That opens selling on the Exchange.`;
  if (!listed && G.items.some(i => i.g >= 3 && !T.equippedBy(G, i.id))) return 'You can sell now. Pick your Prized item in the Pack and list it on the Exchange.';
  if (G.party.length < 2 && G.talents.slot === undefined) return 'Save 1,500 coin for a second traveller in the Almanac. Bosses get much easier.';
  if (G.party.length < T.partySize(G)) return 'You have an open crew slot. Deploy another traveller on the Crew tab.';
  const nxt = G.stage + 1;
  if (nxt < T.STAGE_COUNT && T.stageInfo(nxt).boss && G.mats.seal < 1) return 'The next boss gate needs a Warden Seal. Chests drop them, and the Exchange sells them.';

function spark(key, now, color) {
  const pts = [];
  for (let i = 24; i >= 0; i--) pts.push(T.refPrice(key, now - i * HOUR));
  const lo = Math.min(...pts), hi = Math.max(...pts), w = 84, h = 22;
  const xy = pts.map((p, i) => [i / 24 * (w - 4) + 2, hi === lo ? h / 2 : h - 3 - (p - lo) / (hi - lo) * (h - 6)]);
  const d = xy.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
  const last = xy[xy.length - 1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="24 hour price, from ${pts[0]} to ${pts[24]} Marks" data-pts="${pts.join(',')}"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.5"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2" fill="${color}"/></svg>`;
}

  return `<div class="headrow"><h2>Exchange</h2><p class="sub"><span class="pill ${Net.status}">${status[0]}</span> ${status[1]} Marks are play money. They cannot be withdrawn.</p></div>
  <p class="bulletin ${ev.kind}"><b>Bulletin</b> ${esc(ev.text)} <span class="dim">Next report in ${clock((ev.b + 1) * 12 * HOUR - now)}.</span></p>
  <h3>Your listings</h3>
  <div class="lslots">${slotCards}</div>

  etch: d => act(T.etch(G, d.id, +d.t, +d.s), 'Etched.'),
  strip: d => { const r = T.strip(G, d.id); act(r, r.ok ? `Stripped for ${fmt(r.cost)} coin. The gems are gone.` : null); },
  openList: d => { ui.listing = d.id; touch(); },
  closeList: () => { ui.listing = null; touch(); },
  confirmList: d => {
    const it = T.findItem(G, d.id);
    const price = Math.round(+$('listPrice').value);
    const r = T.createListing(G, { itemId: d.id }, price, Date.now());
    if (act(r, it ? `Listed your ${T.itemName(it)} for ${fmt(price)} Marks.` : null)) { ui.listing = null; ui.sel = null; publishListing(r.rec); saveCloud(true); }
  },
  cancelList: d => cancelMine(d.id),
  fuseG: d => { ui.fuseG = +d.g; ui.lastFuse = null; touch(); },
  fuse: () => {
    const sel = $('fuseSlot');
    ui.fuseSlot = sel && G.forge.lvl >= 4 ? sel.value : '';
    const r = T.fuse(G, ui.fuseG, ui.fuseSlot || undefined);
    if (r.err) return say(r.err, 'warn');
    const g = r.item.g, name = `${GRADES[g].n} ${T.itemName(r.item)}`;
    ui.lastFuse = { g, text: r.stayed ? `No upgrade. You got a ${name}.` : r.jumped ? `Great success! You got a ${name}.` : `You got a ${name}.` };
    say(name, g >= 4 ? 'big' : '', GRADES[g].c);
    saveLocal(); touch();
  },
  buyDrift: d => {
    const r = T.buyFromDrifter(G, d.key, Date.now(), ui.peerKeys[d.key] || 0);
    act(r, r.err ? null : `Bought for ${fmt(r.price)} Marks. It is in your Pack.`);
  },
  buyPeer: d => buyPeer(d.id),
  mkGrade: d => { ui.mkGrade = +d.g; touch(); },
  talent: d => act(T.buyTalent(G, d.k), `${T.talentDef(d.k).n} upgraded.`),
  saveName: () => { const v = $('crewName').value.trim().slice(0, 20); if (v) { G.crew = v; Net.lastBoard = 0; pushBoard(); act(null, 'Crew name saved.'); } },
  reset: () => { ui.confirmReset = true; touch(); },
  resetNo: () => { ui.confirmReset = false; touch(); },
  resetYes: () => { ui.confirmReset = false; adopt(T.newGame(Date.now())); ui.sel = null; saveLocal(); saveCloud(true); switchTab('crew'); say('A new crew sets out.'); },
  openChest: () => { const r = T.openChest(G, Date.now()); announceLoot(r); saveLocal(); updateHud(); },
  openAll: () => { while (G.chests.length) announceLoot(T.openChest(G, Date.now())); saveLocal(); updateHud(); },
  stagePrev: () => { const r = T.jumpStage(G, B, G.stage - 1); if (r.err) say(r.err, 'warn'); else { G.hold = true; touch(); } updateHud(); },
  stageNext: () => { const r = T.jumpStage(G, B, G.stage + 1); if (r.err) say(r.err, 'warn'); updateHud(); },
  hold: () => { G.hold = !G.hold; updateHud(); },
};
function switchTab(t) { ui.tab = t; $('panel').scrollTop = 0; ui.dirty = true; ui.pressing = false; renderPanel(); ui.dirty = false; }

function wire() {
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (b && !b.disabled && actions[b.dataset.act]) { actions[b.dataset.act](b.dataset); ui.pressing = false; maybeRender(); return; }
    const t = e.target.closest('#tabs button');
    if (t) switchTab(t.dataset.tab);
  });
  document.addEventListener('pointerdown', () => { ui.pressing = true; });
  document.addEventListener('pointerup', () => { ui.pressing = false; });
  document.addEventListener('pointercancel', () => { ui.pressing = false; });
  document.addEventListener('input', e => {
    const id = e.target.id;
    if (id === 'listPrice') updateQuote();
    if (id === 'matPrice') updateMatQuote();
    if (id === 'mkQuery') { ui.mkQuery = e.target.value; const pos = e.target.selectionStart; renderPanel(); const n = $('mkQuery'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
  });
  document.addEventListener('change', e => { if (e.target.id === 'mkSlot') { ui.mkSlot = e.target.value; e.target.blur(); touch(); } if (e.target.id === 'mkSort') { ui.mkSort = e.target.value; e.target.blur(); touch(); } if (e.target.id === 'fuseSlot') { ui.fuseSlot = e.target.value; } });
  document.addEventListener('submit', e => {
    if (e.target.id !== 'matForm') return;
    e.preventDefault();
    const mat = $('matSel').value, qty = Math.floor(+$('matQty').value), price = Math.round(+$('matPrice').value);
    const r = T.createListing(G, { mat, qty }, price, Date.now());
    if (act(r, r.err ? null : `Listed ${qty} × ${MATS[mat].n} for ${fmt(price)} Marks.`)) { publishListing(r.rec); saveCloud(true); document.activeElement && document.activeElement.blur(); }
  });
  document.addEventListener('mousemove', e => {
    const tip = $('tip');
    const s = e.target.closest ? e.target.closest('.spark') : null;
    if (!s) { tip.hidden = true; return; }
    const r = s.getBoundingClientRect(), pts = s.dataset.pts.split(',');
    const i = Math.max(0, Math.min(24, Math.round((e.clientX - r.left) / r.width * 24)));
    tip.textContent = `${24 - i === 0 ? 'Now' : (24 - i) + ' h ago'}: ${fmt(+pts[i])} Marks`;
    tip.hidden = false;
    tip.style.left = Math.min(innerWidth - 150, e.clientX + 12) + 'px';
    tip.style.top = (e.clientY - 30) + 'px';
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { saveLocal(); saveCloud(true); } });
  window.addEventListener('pagehide', saveLocal);
  new ResizeObserver(sizeStrip).observe(cv());
  setInterval(() => { if (document.hidden) { advance(); maybeRender(); } }, 1000);
}

function start(data) {
  const save = (data && data.save && JSON.parse(data.save)) || readLocal();
  Net.localSeen = save && save.v === 1 ? save.lastSeen : 0;
  if (save && save.v === 1) { G = save; G.statsDirty = true; }
  else G = T.newGame(Date.now());
  const away = T.applyAway(G, Date.now());
  B = T.newBattle(G);
  try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ save: serialize() })); } catch (e) { /* hook is optional */ }
  wire(); sizeStrip(); updateHud(); renderPanel();
  if (away) say(`Welcome back. ${short(away.coin)} coin and ${short(away.xp)} XP came in while you were away.`, 'big', '#f4b942');
  connect();
  requestAnimationFrame(frame);
  if (location.hostname === 'localhost') window.__tf = { get G() { return G; }, get B() { return B; }, ui, Net, T };
}
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
